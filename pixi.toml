[workspace]
name = "grund"
version = "0.1.0"
description = "Grounded answers over Statistics Iceland PxWeb"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
fastapi = ">=0.115"
uvicorn = ">=0.32"
pydantic = ">=2.6"
numpy = ">=1.26"
pytest = ">=8"
httpx = ">=0.27"

[pypi-dependencies]
grund = { path = ".", editable = true }
fastembed = ">=0.4"

[tasks]
crawl = "python -m grund_index.crawl --out data/catalog/tables.jsonl --cache data/cache"
index = "python -m grund_index.build"
eval-gen = "python -m grund_eval.generate"
eval = "python -m grund_eval.harness"
test = "pytest -q"
serve = "uvicorn grund.api:app --host 0.0.0.0 --port 8741"
ask = "python -m grund"

[activation]
scripts = ["activation.sh"]
